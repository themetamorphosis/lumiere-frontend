name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend branch, tag, or commit for the browser check
        type: string
      staging_tmdb:
        description: Check live TMDB search and details through staging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / Lint / Test / Build / Browser
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumiere
          POSTGRES_PASSWORD: lumiere
          POSTGRES_DB: lumiere_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumiere -d lumiere_release_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - uses: actions/checkout@v4
        with:
          repository: themetamorphosis/lumiere-backend
          ref: ${{ inputs.backend_ref || vars.LUMIERE_BACKEND_REF || 'master' }}
          token: ${{ secrets.LUMIERE_BACKEND_READ_TOKEN || github.token }}
          path: release-backend
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: release-backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r release-backend/requirements.txt

      - name: Register, import, share, and revoke in Chromium
        env:
          API_URL: http://127.0.0.1:8000/api/v1
          DATABASE_URL: postgresql+asyncpg://lumiere:lumiere@127.0.0.1:5432/lumiere_release_test
          SECRET_KEY: local-release-ci-secret-key-at-least-32-characters
          TMDB_API_KEY: local-development-placeholder
          FRONTEND_URL: http://localhost:3000
          ENVIRONMENT: test
        run: |
          (cd release-backend && alembic upgrade head && exec python -m uvicorn app.main:app --host 127.0.0.1 --port 8000) > "$RUNNER_TEMP/lumiere-api.log" 2>&1 &
          backend_pid=$!
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 > "$RUNNER_TEMP/lumiere-web.log" 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --max-time 5 -fsS http://127.0.0.1:8000/health/ready
          curl --retry 30 --retry-connrefused --retry-delay 1 --max-time 5 -fsS http://localhost:3000/api/chat
          npm run check:e2e

      - name: Show service logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/lumiere-*.log; do
            if [ -f "$log" ]; then tail -n 100 "$log"; fi
          done

  staging-tmdb:
    name: Live TMDB staging smoke check
    if: github.event_name == 'workflow_dispatch' && inputs.staging_tmdb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check staging search and details
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: npm run check:staging-tmdb
