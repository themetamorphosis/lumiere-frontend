services:
  postgres:
    image: postgres:16-alpine
    container_name: lumiere-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumiere
      POSTGRES_PASSWORD: lumiere
      POSTGRES_DB: lumiere_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lumiere -d lumiere_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../lumiere-backend
      dockerfile: Dockerfile
    image: lumiere-backend:local
    container_name: lumiere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lumiere:lumiere@postgres:5432/lumiere_db}
      SECRET_KEY: ${SECRET_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000/api/v1}
    image: lumiere-frontend:local
    container_name: lumiere-frontend-app
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      API_URL: http://backend:8000/api/v1
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
